<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俺の実況 V12.3 実況文品質改善版</title>
<link rel="stylesheet" href="style.css">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3831625471820172"
     crossorigin="anonymous"></script>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="badge">V12.3 実況文品質改善版</div>
    <h1>⚾ 俺の実況</h1>
    <p class="lead">
      効果音なし。字幕なし。<br>
      元動画音声50% + AI実況100%。さらに途中切れしない自然な実況文へ改善。
    </p>
    <a href="#make" class="cta">AI実況動画を作る</a>
  </div>
</header>

<main>
<section class="section" id="make">
  <div class="inner">
    <h2>AI実況動画を作る</h2>

    <div class="form">
      <label>野球ショート動画（5分以内）</label>
      <input type="file" id="videoFile" accept="video/*">
      <video id="preview" controls style="display:none;"></video>
      <p id="durationText" class="hint"></p>

      <label>実況スタイル</label>
      <select id="style">
        <option value="normal">普通実況</option>
        <option value="hot">熱血実況</option>
        <option value="pro">プロ野球実況風</option>
        <option value="koshien">高校野球実況風</option>
        <option value="youtube">YouTube実況者風</option>
        <option value="funny">おもしろ実況</option>
      </select>

      <label>盛り上がり度</label>
      <select id="excitement">
        <option value="50">50% 落ち着き</option>
        <option value="70">70% やや熱く</option>
        <option value="100" selected>100% 標準</option>
        <option value="150">150% 超熱血</option>
      </select>

      <label>AI音声タイプ</label>
      <select id="voiceType">
        <option value="male">男性実況者風</option>
        <option value="energetic">勢いのある実況風</option>
        <option value="calm">落ち着いた実況風</option>
        <option value="female">女性実況者風</option>
      </select>

      <label>追加リクエスト（任意）</label>
      <textarea id="requestText" placeholder="例：短く熱く。三振なら前振りなしで。"></textarea>

      <button onclick="analyzeVideo()">① AI映像解析する</button>

      <div id="loading" class="loading" style="display:none;">
        <h3>処理中...</h3>
        <div class="bar-wrap"><div id="bar" class="bar"></div></div>
        <p id="loadingText">動画を解析しています...</p>
      </div>

      <div id="errorArea" class="error" style="display:none;"></div>

      <div id="confirmArea" class="result" style="display:none;">
        <h2>AI解析結果</h2>
        <div id="analysisText" class="result-text"></div>

        <h3>実況品質スコア</h3>
        <div id="qualityText" class="score"></div>

        <label>プレー種類を確認・修正</label>
        <select id="confirmedPlayType">
          <option value="strikeout">三振</option>
          <option value="hit">ヒット</option>
          <option value="homerun">ホームラン</option>
          <option value="timely">タイムリーヒット</option>
          <option value="fineplay">ファインプレー</option>
          <option value="score">得点シーン</option>
          <option value="pitching">投球シーン</option>
          <option value="batting">打撃シーン</option>
          <option value="walk">四球</option>
          <option value="unknown">不明</option>
        </select>

        <label>細分化を確認・修正</label>
        <select id="confirmedSubPlayType">
          <option value="unknown">不明</option>
          <option value="swinging_strikeout">空振り三振</option>
          <option value="looking_strikeout">見逃し三振</option>
          <option value="left_hit">レフト前ヒット</option>
          <option value="center_hit">センター前ヒット</option>
          <option value="right_hit">ライト前ヒット</option>
          <option value="infield_hit">内野安打</option>
          <option value="flyout">フライアウト</option>
          <option value="groundout">ゴロアウト</option>
          <option value="diving_catch">ダイビングキャッチ</option>
          <option value="double_play">ダブルプレー</option>
          <option value="great_throw">好送球</option>
          <option value="home_run">ホームラン</option>
        </select>

        <label>実況開始秒を修正（任意）</label>
        <input type="number" id="startTimeOverride" step="0.1" min="0" placeholder="空欄ならAI推定の開始秒を使用">

        <button onclick="generateVideo()">② この内容で実況動画を作る</button>
        <button class="sub" onclick="regenerateOnly()">実況だけ再生成する</button>
      </div>

      <div id="resultArea" class="result" style="display:none;">
        <h2>完成しました</h2>

        <h3>確定プレー</h3>
        <div id="confirmedText" class="result-text"></div>

        <h3>生成された実況文</h3>
        <div id="resultText" class="result-text"></div>
        <p id="metaText" class="hint"></p>

        <h3>AI実況音声</h3>
        <audio id="audioPlayer" controls style="width:100%;margin-top:12px;"></audio>
        <a id="audioDownload" class="download" download="oreno-jikkyo.mp3">⬇ MP3をダウンロード</a>

        <h3>実況付き動画</h3>
        <video id="resultVideo" controls style="width:100%;margin-top:12px;"></video>
        <a id="videoDownload" class="download" download="oreno-jikkyo.mp4">⬇ MP4をダウンロード</a>
      </div>
    </div>
  </div>
</section>
</main>

<footer>
  <a href="terms.html">利用規約</a>
  <a href="privacy.html">プライバシーポリシー</a>
  <a href="tokushoho.html">特定商取引法に基づく表記</a>
  <a href="company.html">運営者情報</a>
</footer>
<script src="script.js"></script>
</body>
</html>
